[project]
name = "trailbot-mcp"
version = "0.1.0"
description = "MCP server exposing Trailbot MTB trail status"
requires-python = ">=3.12"
dependencies = ["mcp>=2.2,<3", "httpx>=0.27", "uvicorn>=0.30"]

[project.scripts]
trailbot-mcp = "trailbot_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
